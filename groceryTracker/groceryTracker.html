<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Tracker</title>
</head>
<body>
  <h2>Grocery Expenditure Calculator</h2>

  <label for="grocery1">Enter first grocery amount</label>
  <input type="number" id="grocery1" placeholder="Enter first grocery amount"><br><br>

  <label for="grocery2">Enter second grocery amount</label>
  <input type="number" id="grocery2" placeholder="Enter second grocery amount"><br><br>

  <label for="grocery3">Enter third grocery amount</label>

  <button id="calculateBtn" type="button">Calculate Total Expenditure</button>

  <p id="result"></p>

  <script src="groceryTracker.js"></script>
</body>
</html>
